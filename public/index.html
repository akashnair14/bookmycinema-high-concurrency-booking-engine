<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookMyShow - Movie Tickets, Showtimes & Cinema</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bms: {
              red: '#f84464',
              dark: '#333545',
              gray: '#666666',
              lightGray: '#f5f5fa',
              green: '#4abd5d',
              border: '#e5e5e5'
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .screen-arch {
      border-top: 3px solid #60a5fa;
      border-radius: 50% 50% 0 0 / 16px 16px 0 0;
      box-shadow: 0 -6px 12px -2px rgba(96, 165, 250, 0.2);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- TOP NAVBAR -->
  <header class="bg-bms-dark text-white sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <a href="/" class="flex items-center text-xl font-bold tracking-tight text-white">
          <span class="text-white">book<span class="text-bms-red">my</span>show</span>
        </a>
        <div class="hidden md:flex items-center bg-white text-gray-700 rounded px-3 py-1.5 w-80 text-sm shadow-inner">
          <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2 text-xs"></i>
          <input type="text" placeholder="Search for Movies, Cinemas..." class="w-full text-xs outline-none bg-transparent">
        </div>
      </div>
      <div class="flex items-center space-x-4 text-xs">
        <div class="flex items-center space-x-1 cursor-pointer hover:text-gray-300">
          <span>Bengaluru</span>
          <i class="fa-solid fa-chevron-down text-[10px]"></i>
        </div>
        <button class="bg-bms-red hover:bg-red-600 text-white px-3.5 py-1.5 rounded font-medium text-xs transition">
          Sign In
        </button>
      </div>
    </div>
  </header>

  <!-- THEATRE HEADER -->
  <section class="bg-white border-b border-gray-200 py-4">
    <div class="max-w-7xl mx-auto px-4">
      <h1 id="theatreName" class="text-xl font-bold text-gray-900">PVR INOX: Forum Mall, Koramangala</h1>
      <p class="text-xs text-gray-500 mt-1">
        Hosur Road, Koramangala, Bengaluru &nbsp;|&nbsp; Food & Beverage &nbsp;|&nbsp; M-Ticket Available
      </p>
    </div>
  </section>

  <!-- 7-DAY DATE PICKER SLIDER -->
  <section class="bg-white border-b border-gray-200 sticky top-12 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4">
      <div id="dateStrip" class="flex items-center space-x-2 py-2.5 overflow-x-auto no-scrollbar">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </section>

  <!-- MOVIE SHOWTIMES LIST -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <div id="movieList" class="space-y-4">
      <div class="text-center py-12 text-gray-400 text-sm">Loading shows...</div>
    </div>
  </main>

  <!-- SEAT SELECTION MODAL -->
  <div id="seatModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-lg shadow-xl max-w-xl w-full overflow-hidden flex flex-col max-h-[90vh]">
      <!-- Header -->
      <div class="bg-gray-900 text-white px-5 py-3.5 flex items-center justify-between">
        <div>
          <h3 id="modalMovieTitle" class="font-bold text-base">Movie Title</h3>
          <p id="modalShowDetails" class="text-xs text-gray-400">Audi 1 • 09:30 AM</p>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Seating Canvas -->
      <div class="p-6 overflow-y-auto flex-1">
        <div class="text-center mb-6">
          <div class="screen-arch w-3/4 mx-auto pt-2 text-[10px] tracking-wider text-gray-400 uppercase">
            SCREEN THIS WAY
          </div>
        </div>

        <div id="seatGrid" class="space-y-3 max-w-sm mx-auto">
          <!-- Dynamically populated seats -->
        </div>

        <!-- Legend -->
        <div class="flex items-center justify-center space-x-5 mt-6 pt-4 border-t border-gray-100 text-xs text-gray-500">
          <div class="flex items-center space-x-1.5">
            <div class="w-3.5 h-3.5 border border-green-600 bg-white rounded"></div>
            <span>Available</span>
          </div>
          <div class="flex items-center space-x-1.5">
            <div class="w-3.5 h-3.5 bg-green-600 rounded"></div>
            <span>Selected</span>
          </div>
          <div class="flex items-center space-x-1.5">
            <div class="w-3.5 h-3.5 bg-orange-400 rounded"></div>
            <span>Held</span>
          </div>
          <div class="flex items-center space-x-1.5">
            <div class="w-3.5 h-3.5 bg-gray-300 rounded"></div>
            <span>Sold</span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="bg-gray-50 border-t border-gray-200 px-5 py-3.5 flex items-center justify-between">
        <div>
          <div class="text-[11px] text-gray-500">Seats: <span id="selectedSeatsText" class="font-semibold text-gray-800">None</span></div>
          <div class="text-sm font-bold text-gray-900">Total: ₹<span id="totalAmount">0</span></div>
        </div>
        <button id="holdBtn" onclick="holdSelectedSeats()" class="bg-bms-red hover:bg-red-600 text-white px-5 py-2 rounded text-xs font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed">
          Hold Seats
        </button>
      </div>
    </div>
  </div>

  <!-- HOLD TIMER BAR -->
  <div id="activeHoldBanner" class="fixed bottom-4 right-4 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-lg border border-gray-800 z-50 hidden max-w-sm">
    <div class="flex items-center space-x-3">
      <div class="flex-1">
        <div class="text-xs text-gray-400">Ref: <span id="holdRef" class="font-mono text-white font-semibold">...</span></div>
        <div class="text-xs font-semibold text-yellow-400 mt-0.5">Time Left: <span id="timerCountdown" class="font-mono font-bold">10:00</span></div>
      </div>
      <div class="flex items-center space-x-1.5">
        <button onclick="simulatePayment()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-semibold px-3 py-1.5 rounded transition">
          Pay
        </button>
        <button onclick="cancelHold()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs px-2.5 py-1.5 rounded transition">
          Release
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    const THEATRE_ID = 1;
    let selectedDate = '2026-10-01';
    let currentShowId = null;
    let selectedSeats = new Set();
    let currentHold = null;
    let countdownInterval = null;

    // Load Dates
    async function loadDates() {
      try {
        const res = await fetch(`/api/v1/theatres/${THEATRE_ID}/dates`);
        const data = await res.json();
        const dateStrip = document.getElementById('dateStrip');
        dateStrip.innerHTML = '';

        data.dates.forEach((d, idx) => {
          const isSelected = d.show_date === selectedDate || idx === 0;
          if (idx === 0) selectedDate = d.show_date;

          const dateBtn = document.createElement('button');
          dateBtn.className = `flex flex-col items-center justify-center px-4 py-1.5 rounded transition min-w-[65px] ${
            isSelected ? 'bg-bms-red text-white' : 'text-gray-700 hover:bg-gray-100'
          }`;
          dateBtn.innerHTML = `
            <span class="text-[10px] font-semibold uppercase">${d.day_short}</span>
            <span class="text-xs font-bold">${d.day_month.split(' ')[0]}</span>
            <span class="text-[9px] uppercase">${d.day_month.split(' ')[1]}</span>
          `;
          dateBtn.onclick = () => {
            selectedDate = d.show_date;
            document.querySelectorAll('#dateStrip button').forEach(b => {
              b.className = 'flex flex-col items-center justify-center px-4 py-1.5 rounded transition min-w-[65px] text-gray-700 hover:bg-gray-100';
            });
            dateBtn.className = 'flex flex-col items-center justify-center px-4 py-1.5 rounded transition min-w-[65px] bg-bms-red text-white';
            loadShows();
          };
          dateStrip.appendChild(dateBtn);
        });

        loadShows();
      } catch (err) {
        console.error('Failed to load dates', err);
      }
    }

    // Load Shows (P2)
    async function loadShows() {
      const container = document.getElementById('movieList');
      container.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">Loading shows...</div>';

      try {
        const res = await fetch(`/api/v1/theatres/${THEATRE_ID}/shows?date=${selectedDate}`);
        const data = await res.json();

        if (data.theatreName) {
          document.getElementById('theatreName').innerText = data.theatreName;
        }

        if (!data.movies || data.movies.length === 0) {
          container.innerHTML = `<div class="bg-white rounded-lg p-6 text-center text-gray-500 text-sm">No shows scheduled for ${selectedDate}.</div>`;
          return;
        }

        container.innerHTML = '';
        data.movies.forEach(movie => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-xl border border-gray-200 p-5 shadow-xs hover:border-gray-300 transition';

          const showPills = movie.shows.map(s => `
            <button onclick="openSeatModal(${s.showId}, '${movie.title}', '${s.screenNumber} • ${s.screenType}', '${s.showTime}')"
              class="group min-w-[105px] border border-gray-300 hover:border-green-600 bg-white hover:bg-green-50/50 rounded-lg py-2 px-3 text-center transition flex flex-col items-center justify-center">
              <span class="text-xs font-bold text-gray-900 group-hover:text-green-700 tracking-tight">${s.showTime}</span>
              <span class="text-[10px] font-semibold text-gray-400 group-hover:text-green-600 uppercase tracking-wider mt-0.5">${s.screenType}</span>
            </button>
          `).join('');

          card.innerHTML = `
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
              <div class="space-y-1 lg:max-w-xs flex-shrink-0">
                <div class="flex items-center space-x-2">
                  <h3 class="font-extrabold text-lg text-gray-950 tracking-tight leading-snug">${movie.title}</h3>
                </div>
                <div class="inline-block text-[11px] font-bold text-gray-700 bg-gray-100 px-2 py-0.5 rounded border border-gray-200">
                  ${movie.certification}
                </div>
                <div class="text-xs text-gray-500 font-medium">
                  ${movie.language}
                </div>
                <div class="text-[11px] text-gray-400">
                  ${movie.genre || 'Action/Drama'} &nbsp;•&nbsp; ${movie.duration || '2h 20m'}
                </div>
              </div>

              <!-- Showtimes list with flexible wrapping -->
              <div class="flex flex-wrap gap-2.5 items-center flex-1 lg:justify-start">
                ${showPills}
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `<div class="text-center py-6 text-red-500 text-xs">Failed to load shows: ${err.message}</div>`;
      }
    }

    // Open Seat Modal
    async function openSeatModal(showId, title, screen, time) {
      currentShowId = showId;
      selectedSeats.clear();
      updateSelectedSeatsUI();

      document.getElementById('modalMovieTitle').innerText = title;
      document.getElementById('modalShowDetails').innerText = `${screen} • ${time}`;

      const grid = document.getElementById('seatGrid');
      grid.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs">Loading seats...</div>';
      document.getElementById('seatModal').classList.remove('hidden');

      try {
        const res = await fetch(`/api/v1/shows/${showId}/seats`);
        const data = await res.json();
        renderSeatGrid(data.seats || []);
      } catch (err) {
        grid.innerHTML = `<div class="text-center py-4 text-red-500 text-xs">Failed to load seats: ${err.message}</div>`;
      }
    }

    function closeModal() {
      document.getElementById('seatModal').classList.add('hidden');
    }

    // Render Seat Grid
    function renderSeatGrid(seatsList) {
      const grid = document.getElementById('seatGrid');
      grid.innerHTML = '';

      if (!seatsList || seatsList.length === 0) {
        grid.innerHTML = '<div class="text-center text-gray-400 py-4 text-xs">No seating layout found.</div>';
        return;
      }

      const rowMap = new Map();
      seatsList.forEach(s => {
        if (!rowMap.has(s.row_label)) rowMap.set(s.row_label, []);
        rowMap.get(s.row_label).push(s);
      });

      const sortedRowLabels = Array.from(rowMap.keys()).sort((a, b) => b.localeCompare(a));

      sortedRowLabels.forEach(rowLabel => {
        const rowSeats = rowMap.get(rowLabel).sort((a, b) => a.seat_number - b.seat_number);
        const price = rowSeats[0]?.price || 250;

        const rowDiv = document.createElement('div');
        rowDiv.className = 'flex items-center space-x-2';

        const label = document.createElement('div');
        label.className = 'w-5 text-xs font-bold text-gray-400 text-center';
        label.innerText = rowLabel;
        rowDiv.appendChild(label);

        const seatsDiv = document.createElement('div');
        seatsDiv.className = 'flex-1 flex justify-center space-x-2';

        rowSeats.forEach(s => {
          const seat = document.createElement('button');
          const isSold = s.effective_status === 'BOOKED';
          const isHeld = s.effective_status === 'HELD';

          if (isSold) {
            seat.className = 'w-7 h-7 rounded text-[11px] font-medium flex items-center justify-center bg-gray-300 text-gray-500 cursor-not-allowed';
            seat.disabled = true;
          } else if (isHeld) {
            seat.className = 'w-7 h-7 rounded text-[11px] font-medium flex items-center justify-center bg-orange-400 text-white cursor-not-allowed';
            seat.disabled = true;
          } else {
            seat.className = 'w-7 h-7 rounded text-[11px] font-medium flex items-center justify-center transition border border-green-600 text-green-700 hover:bg-green-50';
            seat.onclick = () => {
              if (selectedSeats.has(s.seat_id)) {
                selectedSeats.delete(s.seat_id);
                seat.className = 'w-7 h-7 rounded text-[11px] font-medium flex items-center justify-center transition border border-green-600 text-green-700 hover:bg-green-50';
              } else {
                if (selectedSeats.size >= 6) {
                  alert('Maximum 6 seats allowed per booking.');
                  return;
                }
                selectedSeats.add(s.seat_id);
                seat.className = 'w-7 h-7 rounded text-[11px] font-medium flex items-center justify-center transition bg-green-600 text-white';
              }
              updateSelectedSeatsUI();
            };
          }

          seat.innerText = s.seat_number;
          seatsDiv.appendChild(seat);
        });

        rowDiv.appendChild(seatsDiv);
        grid.appendChild(rowDiv);
      });
    }

    function updateSelectedSeatsUI() {
      const text = document.getElementById('selectedSeatsText');
      const total = document.getElementById('totalAmount');
      const btn = document.getElementById('holdBtn');

      if (selectedSeats.size === 0) {
        text.innerText = 'None';
        total.innerText = '0';
        btn.disabled = true;
      } else {
        text.innerText = Array.from(selectedSeats).join(', ');
        total.innerText = (selectedSeats.size * 350).toString();
        btn.disabled = false;
      }
    }

    // Hold Seats
    async function holdSelectedSeats() {
      if (selectedSeats.size === 0) return;

      const holdBtn = document.getElementById('holdBtn');
      holdBtn.disabled = true;
      holdBtn.innerText = 'Holding...';

      try {
        const res = await fetch(`/api/v1/shows/${currentShowId}/hold-seats`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            seatIds: Array.from(selectedSeats),
            userId: 1,
            ttlSeconds: 600
          })
        });

        const data = await res.json();
        closeModal();

        if (res.status === 200 && data.status === 'HELD') {
          startHoldCountdown(data.bookingReference, data.bookingId, data.expiresInSeconds);
        } else {
          alert(`Conflict: ${data.message || 'Seat could not be held.'}`);
        }
      } catch (err) {
        alert(`Error: ${err.message}`);
      } finally {
        holdBtn.disabled = false;
        holdBtn.innerText = 'Hold Seats';
      }
    }

    // Countdown
    function startHoldCountdown(ref, bookingId, durationSeconds) {
      if (countdownInterval) clearInterval(countdownInterval);

      currentHold = { ref, bookingId, timeLeft: durationSeconds };
      document.getElementById('holdRef').innerText = ref;
      document.getElementById('activeHoldBanner').classList.remove('hidden');

      const timerEl = document.getElementById('timerCountdown');

      countdownInterval = setInterval(() => {
        currentHold.timeLeft--;
        if (currentHold.timeLeft <= 0) {
          clearInterval(countdownInterval);
          document.getElementById('activeHoldBanner').classList.add('hidden');
          alert('Seat hold expired. Seats have been returned to inventory.');
          return;
        }

        const mins = Math.floor(currentHold.timeLeft / 60).toString().padStart(2, '0');
        const secs = (currentHold.timeLeft % 60).toString().padStart(2, '0');
        timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    // Confirm Payment
    async function simulatePayment() {
      if (!currentHold) return;

      try {
        const idempotencyKey = `PAY-${Date.now()}-${Math.random().toString(36).substring(2, 6)}`;
        const res = await fetch('/api/v1/webhooks/payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idempotencyKey,
            bookingId: currentHold.bookingId,
            gatewayTransactionId: 'txn_' + Date.now(),
            paymentGateway: 'RAZORPAY',
            amount: 700,
            paymentStatus: 'SUCCESS'
          })
        });

        const data = await res.json();
        if (res.ok) {
          clearInterval(countdownInterval);
          document.getElementById('activeHoldBanner').classList.add('hidden');
          alert('Payment Successful! Tickets confirmed.');
          loadShows();
        } else {
          alert(`Payment Error: ${data.error}`);
        }
      } catch (err) {
        alert(`Payment Failed: ${err.message}`);
      }
    }

    // Release Hold
    async function cancelHold() {
      if (!currentHold) return;

      const holdToRelease = currentHold;
      if (countdownInterval) clearInterval(countdownInterval);
      document.getElementById('activeHoldBanner').classList.add('hidden');
      currentHold = null;

      try {
        const res = await fetch(`/api/v1/shows/${currentShowId || 1}/release-seats`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            bookingId: holdToRelease.bookingId,
            userId: 1
          })
        });

        if (res.ok) {
          if (!document.getElementById('seatModal').classList.contains('hidden') && currentShowId) {
            const seatsRes = await fetch(`/api/v1/shows/${currentShowId}/seats`);
            const seatsData = await seatsRes.json();
            renderSeatGrid(seatsData.seats || []);
          }
        }
      } catch (err) {
        console.error('Failed to release hold:', err);
      }
    }

    loadDates();
  </script>
</body>
</html>
